name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  dotnet:
    name: .NET build and tests
    runs-on: ubuntu-latest
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Restore
        run: dotnet restore Mdr.sln
      - name: Build
        run: dotnet build Mdr.sln --no-restore -c Release
      - name: Test
        run: dotnet test Mdr.sln --no-build -c Release --collect:"XPlat Code Coverage" --results-directory ./TestResults --logger "trx;LogFilePrefix=results"
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dotnet-test-results
          path: TestResults

  ai-classifier:
    name: Python sidecar (ruff + pytest + coverage)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/ai-classifier
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: src/ai-classifier/pyproject.toml
      - name: Install
        run: pip install -e ".[dev]"
      - name: Ruff
        run: ruff check . && ruff format --check .
      - name: Pytest with coverage gate
        run: pytest --cov=app --cov-report=term-missing --cov-report=xml --cov-fail-under=80

  docker:
    name: Docker images
    runs-on: ubuntu-latest
    needs: [dotnet, ai-classifier]
    steps:
      - uses: actions/checkout@v4
      - name: Build API image
        run: docker build -f docker/api.Dockerfile -t mdr-api:ci .
      - name: Build classifier image
        run: docker build -f docker/ai-classifier.Dockerfile -t mdr-ai-classifier:ci src/ai-classifier
      - name: Validate compose file
        env:
          MSSQL_SA_PASSWORD: Ci_Only_Passw0rd!
          JWT_SIGNING_KEY: ci-only-signing-key-0123456789abcdef
          CLASSIFIER_API_KEY: ci-only-classifier-key
        run: docker compose config --quiet
